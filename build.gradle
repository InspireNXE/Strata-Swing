plugins {
    id 'strata-java'
    id 'strata-documented'
}

description = 'Java2D/Swing adapter for Strata.'

dependencies {
    api(project(':api'))
    api(project(':spi'))
    implementation(project(':core'))

    // The SPI contract tests this adapter must pass
    testImplementation(testFixtures(project(':spi')))
}

tasks.named('test', Test) {
    // Swing tests draw to images and call listeners directly; none needs a display
    systemProperty('java.awt.headless', 'true')
}
